<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Connecting…</title>
<style>
  body { margin:0; background:#0a0a0a; display:flex; align-items:center; justify-content:center; height:100vh; font-family:'DM Mono',monospace; color:#444; font-size:12px; letter-spacing:.15em; }
  .dot { width:8px; height:8px; background:#1db954; border-radius:50%; display:inline-block; margin-right:10px; animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
</style>
</head>
<body>
<div><span class="dot"></span>CONNECTING TO SPOTIFY…</div>
<script>
  // Catch the OAuth callback, store the code, redirect back to the hub
  const params = new URLSearchParams(window.location.search);
  const code   = params.get('code');
  const error  = params.get('error');

  if (error) {
    // User denied access or something went wrong
    localStorage.removeItem('dhub_pending_code');
    window.location.href = '/?auth_error=' + encodeURIComponent(error);
  } else if (code) {
    // Store code for the main page to pick up
    localStorage.setItem('dhub_pending_code', code);
    window.location.href = '/';
  } else {
    // No code and no error — just redirect home
    window.location.href = '/';
  }
</script>
</body>
</html>
